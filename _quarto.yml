      </div>

format:
  html:
    color-scheme-toggle: true
    theme:
      light: [cosmo, custom-theme.scss]
      dark: [superhero, custom-theme.scss]
    css: styles.css
    toc: true
    toc-expand: true
    toc-depth: 3
    toc-title: "Índice"
    toc-location: right
    toc-float: false
    grid:
      body-width: 1200px
    include-in-header: # oculta a barra lateral
      text: |
        <style>
        .sidebar-menu-container { display: none !important; }
        </style>
    code-fold: true
    number-sections: true
    embed-resources: true
