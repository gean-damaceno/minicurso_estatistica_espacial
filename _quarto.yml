        <a href="https://des.ufla.br/" target="_blank" rel="noopener">
          <img src="Livros/depart_estatiss.png" alt="DEs" style="width: 140px; margin: 8px;">
        </a>
        <a href="https://www.gov.br/ibama/pt-br" target="_blank" rel="noopener">
